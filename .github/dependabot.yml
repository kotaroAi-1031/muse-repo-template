# Dependabot: keep GitHub Actions (and later, other dependencies) current.
# Weekly is enough for these repositories; security updates still arrive
# immediately through Dependabot alerts/security updates.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7

  # Node dependencies are managed with pnpm. Dependabot tracks pnpm
  # projects through the "npm" ecosystem; enable this for the Alchemy
  # program in infra/ (and adjust the directory for other Node projects).
  - package-ecosystem: "npm"
    directory: "/infra"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7

